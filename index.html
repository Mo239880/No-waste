<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的木箱系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; color: #333;
            display: flex; height: 100vh; padding: 15px; gap: 15px; position: relative;
        }
        .lang-switcher {
            position: absolute; top: 15px; right: 15px; background: white; padding: 8px 12px; 
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100;
        }
        select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }
        
        /* 左侧网格 */
        .grid-container {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px; align-content: start; background: #fff; padding: 15px; 
            border-radius: 12px; overflow-y: auto; margin-top: 45px;
        }
        .wood-box-btn {
            background: #8d6e63; border: 2px solid #5d4037; border-radius: 6px; 
            padding: 10px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer;
        }
        .wood-box-btn:hover { background: #795548; }
        .wood-box-btn.active { background: #3e2723; border-color: #ffb300; color: #ffb300; }
        
        /* 右侧面板 */
        .detail-panel {
            width: 350px; background: white; border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; border-top: 5px solid #8d6e63; margin-top: 45px;
        }
        .detail-panel h2 { color: #5d4037; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .detail-content { font-size: 14px; overflow-y: auto; flex: 1; }
        
        /* 纸箱卡片 */
        .paper-box-item {
            background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px; 
            margin-bottom: 10px; border-radius: 4px;
        }
        .paper-box-title { font-weight: bold; color: #e65100; margin-bottom: 5px; }
        .row { display: flex; margin-bottom: 3px; color: #555; }
        .row span.label { width: 70px; color: #999; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; padding-top: 60px; }
            .lang-switcher { top: 10px; right: 10px; width: calc(100% - 20px); text-align: right; }
            .grid-container, .detail-panel { margin-top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        🌐 语言: <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="zh">中文</option><option value="en">English</option>
            <option value="de">Deutsch</option><option value="fr">Français</option>
            <option value="it">Italiano</option><option value="ko">한국어</option>
            <option value="ja">日本語</option><option value="es">Español</option>
            <option value="pt">Português</option>
        </select>
    </div>

    <div class="grid-container" id="gridContainer"></div>

    <div class="detail-panel">
        <h2 id="panelTitle">请选择木箱</h2>
        <div class="detail-content" id="panelContent">👈 点击左侧查看明细。</div>
    </div>

    <script>
        // 🌐 1. 界面多语言（只翻译按钮和标题，节约代码）
        const t = {
            zh: { box: "木箱", details: "明细", carton: "纸箱", sn: "序列号", item: "物品", tip: "👈 点击左侧查看明细。" },
            en: { box: "Box", details: "Details", carton: "Carton", sn: "S/N", item: "Item", tip: "👈 Click left to view." },
            de: { box: "Kiste", details: "Details", carton: "Karton", sn: "S/N", item: "Inhalt", tip: "👈 Klicken Sie links." },
            fr: { box: "Caisse", details: "Détails", carton: "Carton", sn: "N/S", item: "Contenu", tip: "👈 Cliquez à gauche." },
            it: { box: "Cassa", details: "Dettagli", carton: "Scatola", sn: "N/S", item: "Contenuto", tip: "👈 Clicca a sinistra." },
            ko: { box: "상자", details: "세부 정보", carton: "종이 상자", sn: "일련 번호", item: "내용물", tip: "👈 왼쪽을 클릭하세요." },
            ja: { box: "木箱", details: "明細", carton: "段ボール", sn: "S/N", item: "内容物", tip: "👈 左をクリック。" },
            es: { box: "Caja", details: "Detalles", carton: "Caja", sn: "N/S", item: "Contenido", tip: "👈 Haga clic a la izquierda." },
            pt: { box: "Caixa", details: "Detalhes", carton: "Caixa", sn: "N/S", item: "Conteúdo", tip: "👈 Clique à esquerda." }
        };

        // 📦 2. 数据区（最纯粹的格式，绝对不会错）
        // 我把 50 个木箱分成了 50 行。你可以直接修改双引号里的文字。
        const myData = [
            { id: 1, boxes: [ { id: 1, sn: "SN-01A", item: "冬季衣物" }, { id: 2, sn: "SN-01B", item: "旧书" } ] },
            { id: 2, boxes: [ { id: 1, sn: "SN-02A", item: "厨房锅具" } ] },
            { id: 3, boxes: [ { id: 1, sn: "SN-03A", item: "相机" }, { id: 2, sn: "SN-03B", item: "镜头" }, { id: 3, sn: "SN-03C", item: "三脚架" } ] },
            { id: 4, boxes: [ { id: 1, sn: "SN-04A", item: "五金工具" } ] },
            { id: 5, boxes: [ { id: 1, sn: "SN-05A", item: "合同" }, { id: 2, sn: "SN-05B", item: "印章" } ] },
            { id: 6, boxes: [ { id: 1, sn: "SN-06A", item: "运动鞋" } ] },
            { id: 7, boxes: [ { id: 1, sn: "SN-07A", item: "化妆品" } ] },
            { id: 8, boxes: [ { id: 1, sn: "SN-08A", item: "狗粮" }, { id: 2, sn: "SN-08B", item: "狗玩具" } ] },
            { id: 9, boxes: [ { id: 1, sn: "SN-09A", item: "茶叶" } ] },
            { id: 10, boxes: [ { id: 1, sn: "SN-10A", item: "陶瓷碗" } ] },
            { id: 11, boxes: [ { id: 1, sn: "SN-11A", item: "数据线" } ] },
            { id: 12, boxes: [ { id: 1, sn: "SN-12A", item: "毛绒玩具" } ] },
            { id: 13, boxes: [ { id: 1, sn: "SN-13A", item: "键盘" }, { id: 2, sn: "SN-13B", item: "鼠标" } ] },
            { id: 14, boxes: [ { id: 1, sn: "SN-14A", item: "帐篷" } ] },
            { id: 15, boxes: [ { id: 1, sn: "SN-15A", item: "急救药" } ] },
            { id: 16, boxes: [ { id: 1, sn: "SN-16A", item: "车用工具" } ] },
            { id: 17, boxes: [ { id: 1, sn: "SN-17A", item: "咖啡机" }, { id: 2, sn: "SN-17B", item: "咖啡豆" } ] },
            { id: 18, boxes: [ { id: 1, sn: "SN-18A", item: "乐高" } ] },
            { id: 19, boxes: [ { id: 1, sn: "SN-19A", item: "吉他" } ] },
            { id: 20, boxes: [ { id: 1, sn: "SN-20A", item: "行李箱" } ] },
            { id: 21, boxes: [ { id: 1, sn: "SN-21A", item: "加湿器" } ] },
            { id: 22, boxes: [ { id: 1, sn: "SN-22A", item: "滤芯" } ] },
            { id: 23, boxes: [ { id: 1, sn: "SN-23A", item: "床单" } ] },
            { id: 24, boxes: [ { id: 1, sn: "SN-24A", item: "工具箱" } ] },
            { id: 25, boxes: [ { id: 1, sn: "SN-25A", item: "登山包" } ] },
            { id: 26, boxes: [ { id: 1, sn: "SN-26A", item: "摄像头" } ] },
            { id: 27, boxes: [ { id: 1, sn: "SN-27A", item: "电钻" } ] },
            { id: 28, boxes: [ { id: 1, sn: "SN-28A", item: "画板" } ] },
            { id: 29, boxes: [ { id: 1, sn: "SN-29A", item: "吸尘器" } ] },
            { id: 30, boxes: [ { id: 1, sn: "SN-30A", item: "床垫罩" } ] },
            { id: 31, boxes: [ { id: 1, sn: "SN-31A", item: "打印机" }, { id: 2, sn: "SN-31B", item: "打印纸" } ] },
            { id: 32, boxes: [ { id: 1, sn: "SN-32A", item: "风扇" } ] },

            { id: 36, boxes: [ { id: 1, sn: "SN-36A", item: "牙刷" } ] },

            { id: 38, boxes: [ { id: 1, sn: "SN-38A", item: "卷发棒" } ] },
            { id: 39, boxes: [ { id: 1, sn: "SN-39A", item: "保温杯" } ] },
            { id: 40, boxes: [ { id: 1, sn: "SN-40A", item: "雨伞" } ] },
            { id: 41, boxes: [ { id: 1, sn: "SN-41A", item: "背包" } ] },
            { id: 42, boxes: [ { id: 1, sn: "SN-42A", item: "钱包" } ] },
            { id: 43, boxes: [ { id: 1, sn: "SN-43A", item: "手表" } ] },
            { id: 44, boxes: [ { id: 1, sn: "SN-44A", item: "首饰" } ] },
            { id: 45, boxes: [ { id: 1, sn: "SN-45A", item: "香水" } ] },
            { id: 46, boxes: [ { id: 1, sn: "SN-46A", item: "墨镜" } ] },
            { id: 47, boxes: [ { id: 1, sn: "SN-47A", item: "钥匙扣" } ] },
            { id: 48, boxes: [ { id: 1, sn: "SN-48A", item: "打火机" } ] },
            { id: 49, boxes: [ { id: 1, sn: "SN-49A", item: "指甲刀" } ] },
            { id: 50, boxes: [ { id: 1, sn: "SN-50A", item: "急救包" } ] }
        ];

        // ⚙️ 3. 渲染逻辑
        let currentLang = 'zh';
        let activeIdx = -1;

        function render() {
            const text = t[currentLang];
            document.getElementById('panelContent').innerHTML = activeIdx === -1 ? text.tip : document.getElementById('panelContent').innerHTML;
            
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            
            myData.forEach((box, index) => {
                const btn = document.createElement('button');
                btn.className = 'wood-box-btn' + (index === activeIdx ? ' active' : '');
                btn.innerText = `${text.box} ${box.id}`;
                btn.onclick = () => {
                    activeIdx = index;
                    render();
                    show(box);
                };
                grid.appendChild(btn);
            });
        }

        function show(box) {
            const text = t[currentLang];
            document.getElementById('panelTitle').innerText = `${text.box} ${box.id} ${text.details}`;
            
            let html = '';
            box.boxes.forEach(pBox => {
                html += `<div class="paper-box-item">
                    <div class="paper-box-title">📦 ${text.carton} ${pBox.id}</div>
                    <div class="row"><span class="label">${text.sn}:</span><span>${pBox.sn}</span></div>
                    <div class="row"><span class="label">${text.item}:</span><span>${pBox.item}</span></div>
                </div>`;
            });
            document.getElementById('panelContent').innerHTML = html;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            render();
            if (activeIdx !== -1) show(myData[activeIdx]);
        }

        render(); // 启动
    </script>
</body>
</html>
